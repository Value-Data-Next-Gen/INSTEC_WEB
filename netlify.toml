# ─── Configuración ÚNICA de Netlify (no duplicar dentro de crypgo/package) ───
# Con base = "crypgo/package", la build corre DENTRO de esa carpeta:
#   - command es relativo a la base → "npm run build" (sin cd, no duplicar ruta)
#   - publish es relativo a la base → "out" (el static export de Next.js)
# El antiguo crypgo/package/netlify.toml duplicaba la ruta (crypgo/package/
# crypgo/package/.next) y rompía el deploy; fue eliminado.
[build]
  base = "crypgo/package"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"
  # URL de la app de gestión a la que apunta el botón "Iniciar sesión".
  # Cambiar a https://app.instecltda.cl cuando el dominio propio tenga SSL.
  NEXT_PUBLIC_APP_URL = "https://instec-app.azurewebsites.net"
  # GA4: propiedad "INSTEC (instecltda.cl)" en la cuenta de Analytics de Value Data
  # (cuenta 43770219), flujo web "INSTEC web" (16338483362). ID público.
  NEXT_PUBLIC_GA_ID = "G-75HGV8G13H"

# Dominio principal: https://instecltda.cl (confirmado 2026-11-13).
# Los dominios alternativos redirigen con 301 conservando la ruta y los ?utm_.
# (www.instecltda.cl -> instecltda.cl lo hace Netlify solo, por ser el primario.)
# No hay fallback SPA: el static export genera un HTML por ruta y Netlify sirve
# 404.html con estado 404 real para lo que no existe (antes devolvía la home con
# 200, lo que generaba soft-404 y servía HTML en /robots.txt y /sitemap.xml).
[[redirects]]
  from = "https://instec.cl/*"
  to = "https://instecltda.cl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.instec.cl/*"
  to = "https://instecltda.cl/:splat"
  status = 301
  force = true

# /proyectos/ se retiró (mostraba trabajos sin respaldo); su contenido real
# (fotos de terreno) vive en la home. 301 para no perder enlaces existentes.
[[redirects]]
  from = "/proyectos/*"
  to = "/#terreno"
  status = 301

# Headers de seguridad para todo el sitio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache largo para assets estáticos con hash.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
